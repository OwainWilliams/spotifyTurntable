<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- csp: the build puts the Content-Security-Policy here (vite.config.ts) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turntable</title>
    <!-- The login redirect URI is built from this page's address, and Spotify
         only accepts http:// for loopback. GitHub Pages also answers on plain
         http, so hop to https before anything else runs. -->
    <script>
      if (location.protocol === 'http:' && !/^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname)) {
        location.replace('https:' + location.href.slice(5))
      }
    </script>
    <!-- Makes it installable as a Chrome app (own window, taskbar icon). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#16110e" />
    <!-- Spotify's player SDK. It calls window.onSpotifyWebPlaybackSDKReady when loaded. -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
